[project]
name = "case-study-2"
version = "0.1.0"
description = "Building and Validating a MOF Synthesis Knowledge Graph with LLMs"
authors = [{ name = "Devendra Singh Dhakad" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # core
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "loguru>=0.7",
    "typer>=0.12",
    # data + ingestion
    "arxiv>=2.1",
    "requests>=2.32",
    "pymupdf>=1.24",
    "lxml>=5.2",
    # nlp
    "spacy>=3.7",
    "scispacy>=0.5",
    # llm orchestration
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "openai>=1.30",
    "anthropic>=0.30",
    # baselines
    "transformers>=4.41",
    "torch>=2.3",
    # graph
    "neo4j>=5.20",
    "networkx>=3.3",
    "sentence-transformers>=3.0",
    # evaluation
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # dashboard
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"
