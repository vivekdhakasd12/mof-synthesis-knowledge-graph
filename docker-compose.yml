services:
  neo4j:
    image: neo4j:5.20-community
    container_name: cs2-neo4j
    ports:
      - "7474:7474"   # HTTP / browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme-strong-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-changeme-strong-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
